<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>桌面管理 · 新界面对比</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:"Segoe UI Variable","Microsoft YaHei UI",sans-serif;background:#101923;color:#eef5f6}body{display:grid;grid-template-rows:auto 1fr;overflow:hidden}.bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#0b121a;border-bottom:1px solid #283744}.title{margin-right:auto;font-weight:700}.title small{font-weight:400;color:#8fa4ae;margin-left:9px}.tab,.open{min-height:40px;border:1px solid #334653;border-radius:10px;background:#17242e;color:#b9cbd1;padding:0 14px;cursor:pointer}.tab:hover,.open:hover{background:#20313d;color:white}.tab.active{border-color:#c9af82;background:#f0e8da;color:#1e2422}.frame{width:100%;height:100%;border:0;background:white}@media(max-width:720px){.bar{display:grid;grid-template-columns:repeat(3,1fr);padding:8px;gap:6px}.title,.open{display:none}.tab{min-width:0;padding:0 4px;font-size:12px;white-space:nowrap}}
</style></head><body><header class="bar"><div class="title">桌面管理 · 界面方案对比 <small>切换后可在方案内查看主界面、收纳窗口和设计说明</small></div><button class="tab" data-file="ui-redesign-uiux-pro-max.html">方案 A · 雾光</button><button class="tab" data-file="ui-redesign-frontend-design.html">方案 B · 星图</button><button class="tab active" data-file="ui-redesign-minimal-premium.html">方案 C · 静奢</button><button class="open">新窗口打开</button></header><iframe class="frame" title="界面方案预览" src="ui-redesign-minimal-premium.html"></iframe><script>
const frame=document.querySelector('.frame');const tabs=[...document.querySelectorAll('.tab')];tabs.forEach(t=>t.addEventListener('click',()=>{tabs.forEach(x=>x.classList.remove('active'));t.classList.add('active');frame.src=t.dataset.file}));document.querySelector('.open').addEventListener('click',()=>window.open(frame.src,'_blank','noopener'));
</script></body></html>
